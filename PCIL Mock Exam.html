<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCIL Interactive Mock Exam</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--primary:#2563eb;--good:#15803d;--bad:#dc2626;--border:#d9dee8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:900px;margin:auto;padding:24px 16px 60px}header{text-align:center;padding:18px 0 12px}h1{margin:0;font-size:30px}.subtitle{color:var(--muted);margin-top:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(15,23,42,.08)}
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}.mode{border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;background:#fff}.mode:hover{border-color:var(--primary)}
.mode h3{margin:0 0 6px}.mode p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2f7;color:#253044}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.meta{color:var(--muted);font-size:14px}.progress-wrap{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress{height:100%;background:var(--primary);width:0;transition:width .25s}
.question{font-size:20px;font-weight:700;line-height:1.6;margin:12px 0 20px}.options{display:grid;gap:12px}.option{border:1px solid var(--border);border-radius:13px;padding:14px 15px;cursor:pointer;background:#fff;display:flex;gap:10px;line-height:1.55}.option:hover{border-color:#9bb8f6;background:#f8fbff}
.option.selected{border-color:var(--primary);background:#eff6ff}.option.correct{border-color:var(--good);background:#f0fdf4}.option.wrong{border-color:var(--bad);background:#fef2f2}.letter{font-weight:800;min-width:24px}
.feedback{margin-top:18px;padding:15px;border-radius:12px;background:#f8fafc;border:1px solid var(--border);line-height:1.6}.feedback.good{background:#f0fdf4;border-color:#bbf7d0}.feedback.bad{background:#fef2f2;border-color:#fecaca}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.score{font-size:46px;font-weight:800;text-align:center}.center{text-align:center}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{padding:15px;background:#f8fafc;border:1px solid var(--border);border-radius:12px;text-align:center}.stat strong{display:block;font-size:22px}
.review{margin-top:20px}.review-item{padding:14px 0;border-top:1px solid var(--border)}.small{font-size:13px;color:var(--muted)}.notice{font-size:13px;color:var(--muted);line-height:1.6;margin-top:18px}.hidden{display:none!important}
@media(max-width:600px){h1{font-size:25px}.card{padding:18px}.question{font-size:18px}.stat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header><h1>PCIL Interactive Mock Exam</h1><div class="subtitle">PCIL 练习测验 · 即时显示正确答案 · 支持随机练习</div></header>

<section id="start" class="card">
<h2>开始练习</h2>
<p>题库共 <strong id="totalCount"></strong> 题。答案依据 <strong>PCIL MOCK EXAM QUESTIONS.pdf</strong> 中的黄色标示答案制作。</p>
<div class="start-grid">
<div class="mode" onclick="startQuiz(20,true)"><h3>20 题随机练习</h3><p>随机抽取 20 题，适合每天快速复习。</p></div>
<div class="mode" onclick="startQuiz(50,true)"><h3>50 题模拟练习</h3><p>随机抽取 50 题，适合完整练习。</p></div>
<div class="mode" onclick="startQuiz(285,false)"><h3>全部题库</h3><p>依照题库顺序完成全部 285 题。</p></div>
</div>
<p class="notice">每题只有一个答案。选择后会即时显示是否正确，并显示该题的正确答案。题目与答案均来自你提供的 PDF。</p>
</section>

<section id="quiz" class="card hidden">
<div class="topbar"><div class="meta" id="progressText"></div><button class="secondary" onclick="confirmExit()">退出</button></div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<div class="meta" id="sourceNumber"></div>
<div class="question" id="questionText"></div>
<div class="options" id="options"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="actions"><button class="secondary" id="prevBtn" onclick="prevQuestion()">上一题</button><button class="primary" id="nextBtn" onclick="nextQuestion()">下一题</button></div>
</section>

<section id="result" class="card hidden">
<div class="center"><h2>练习完成</h2><div class="score" id="score"></div><div id="scoreMessage"></div></div>
<div class="stat-grid"><div class="stat"><strong id="correctCount">0</strong>答对</div><div class="stat"><strong id="wrongCount">0</strong>答错</div><div class="stat"><strong id="percent">0%</strong>正确率</div></div>
<div class="actions"><button class="secondary" onclick="restartSame()">再做一次</button><button class="primary" onclick="showReview()">查看错题</button></div>
<div id="review" class="review hidden"></div>
</section>
</div>

const QUESTION_BANK=[{"number":1,"question":"1）主方可以通过以下方法通知终止代理，除了","options":["撤销通知","完成授权","放弃通知","扩展通知"],"answer":3},{"number":2,"question":"2）所有马来西亚寿险公司的成员同意捉使所有属下代理明白‘歪曲事实’的手法有损保单持有人和寿险行 业的利益，歪曲事实是","options":["属于一种误速行为，即代理员劝诱保单持有人中止一份保单，或使一份保单激清以向另一间或另一间公司购买新 保单，但却没有向保单持有人清楚解释两项保单的差别及取代原有保单所带来的财务后果。","属于一种追加销售，即代理员劝诱保单持有人向另一间或同一间公司购买新保单以增加保险保障，而且向保单持 有人清楚解释两项保单的差别及取代原有保单所带来的财务后果。","属于一种追加销售，即代理员劝诱保单持有人向另一间或同一间公司购买新保单，但却没有向保单持有人清楚 解释两项保单的差别及取代原有保单所带来的财务后果。","属于一种误述行为，即代理员劝诱保单持有人特续一份保单，但同时，向另一间或同一间公司购买新保单，但 却没有向保单持有人清楚解释两项保单的差别及取代原有保单所带来的财务后果。"],"answer":0},{"number":3,"question":"3）普通保险的合约提供的保障保括以下的风险，除了：","options":["法律责任","意外死亡","产业的毁坏","自然死亡"],"answer":0},{"number":4,"question":"4）销售投资联盟产品的保险代理员应该遵守以下的行为准侧指南：","options":["马来西亚保险经纪公会（IBAM）","马来西亚投资经理联合会（FIMM）","UTS 企业顾问（CUTA）","马来西亚寿险公会（LIAM）"],"answer":3},{"number":5,"question":"5） 从以下说明，选出哪项关于单位信托基金是正确的","options":["单位信托基本上是由代理和信托基金公司代表投资者之间的双方协议","信托契据促使基金经理能代表投资者掌管基金的钱财和资产","单位信托投资是由信托契据所建立，内含股票，债卷，固定收益，平衡基金等各种各样的基金","信托人管理投资组合及处理单位信托的股票买卖"],"answer":0},{"number":6,"question":"6）选出那个说明关于多元化投资是正确的。","options":["每年平衡投资组合以确保每个投资的比率保持不变的行为","将投资分散在不同的国家，在指定的领域或高回酬的部分","将投资分散在不同种类的资产，并且跨越不同的市场环境的过程","利用技术分析和市场数据来确定未来市场向的行为"],"answer":2},{"number":7,"question":"7）选出投资股票的优点和缺点","options":["股票可能提供潜在红利和资本增值，但是，股票流动性很低，不可以在公开市场交易","股票不太可能提供好的红利和资本增值，同时股票流动性也很高，可在公开市场交易","股票提供良好的红利和资本增值，同时流动性也高，可在公开市场交易","股票是唯一一个提供资本增值的投资，同时股票流动性也高，可以在公开市场交易"],"answer":2},{"number":8,"question":"8）如果80岁的人士拥有非常激进型基金，或一个20岁的单身人士只投资债卷，这显示","options":["80岁人士风险不愿意承担风险","单身人士是愿意承担风险","年长者在他们的投资组合里比较激进","投资者未进行风险承担能力测试"],"answer":3},{"number":9,"question":"9）选出三个基本风险管理的步骤。","options":["计划，部署和实施","部署，管理和控制","分析，计划和实施","鉴定，分析和控制"],"answer":3},{"number":10,"question":"10）要保书的设计必须遵守寿险业务良好行为准则的 ________ 部分。","options":["第五","第四","第二","第三"],"answer":1},{"number":11,"question":"11）那个说明关于股票时正确的","options":["股票的价钱比起主流市场可以上升，尤其是在市场面对长期下降时期","股票的价钱可以很稳定，尤其是在市场面对长期下降期","股票的回酬潜能显着较高，尤其是在市场活跃时期","股票的回酬潜能显着较低，尤其是在市场活跃时期"],"answer":2},{"number":12,"questi let quiz=[],index=0,answers=[],lastMode=null;
document.getElementById("totalCount").textContent=QUESTION_BANK.length;

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function startQuiz(count,randomize){
  lastMode={count,randomize};
  const base=randomize?shuffle(QUESTION_BANK).slice(0,count):[...QUESTION_BANK];
  quiz=base.map(q=>{
    const pairs=q.options.map((text,i)=>({text,correct:i===q.answer}));
    const s=shuffle(pairs);
    return {...q,displayOptions:s.map(x=>x.text),displayAnswer:s.findIndex(x=>x.correct)};
  });
  index=0;answers=Array(quiz.length).fill(null);
  document.getElementById("start").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  renderQuestion();
}
function renderQuestion(){
  const q=quiz[index];
  document.getElementById("progressText").textContent=`第 ${index+1} / ${quiz.length} 题`;
  document.getElementById("progress").style.width=`${((index+1)/quiz.length)*100}%`;
  document.getElementById("sourceNumber").textContent=`题库原题编号：${q.number}`;
  document.getElementById("questionText").textContent=q.question;
  const box=document.getElementById("options");box.innerHTML="";
  ["A","B","C","D"].forEach((letter,i)=>{
    const d=document.createElement("div");d.className="option";
    d.innerHTML=`<span class="letter">${letter}.</span><span>${esc(q.displayOptions[i])}</span>`;
    d.onclick=()=>choose(i);box.appendChild(d);
  });
  document.getElementById("feedback").className="feedback hidden";
  document.getElementById("prevBtn").disabled=index===0;
  document.getElementById("nextBtn").textContent=index===quiz.length-1?"查看结果":"下一题";
  if(answers[index]!==null)applyAnswerState();
}
function choose(i){if(answers[index]!==null)return;answers[index]=i;applyAnswerState()}
function applyAnswerState(){
  const q=quiz[index],selected=answers[index];if(selected===null)return;
  document.querySelectorAll(".option").forEach((el,i)=>{
    el.classList.remove("selected","correct","wrong");
    if(i===q.displayAnswer)el.classList.add("correct");
    if(i===selected){el.classList.add("selected");if(i!==q.displayAnswer)el.classList.add("wrong")}
  });
  const fb=document.getElementById("feedback");fb.classList.remove("hidden");
  if(selected===q.displayAnswer){
    fb.className="feedback good";fb.innerHTML="<strong>答对了。</strong> 这是该题在答案 PDF 中标示的正确答案。";
  }else{
    fb.className="feedback bad";
    fb.innerHTML=`<strong>答错了。</strong> 正确答案：<strong>${["A","B","C","D"][q.displayAnswer]}. ${esc(q.displayOptions[q.displayAnswer])}</strong><br><span class="small">正确答案依据你提供的 PCIL MOCK EXAM QUESTIONS.pdf 黄色标示。</span>`;
  }
}
function nextQuestion(){
  if(answers[index]===null){alert("请先选择一个答案。");return}
  if(index<quiz.length-1){index++;renderQuestion();scrollTo(0,0)}else showResult()
}
function prevQuestion(){if(index>0){index--;renderQuestion();scrollTo(0,0)}}
function showResult(){
  const correct=answers.reduce((s,a,i)=>s+(a===quiz[i].displayAnswer?1:0),0),wrong=quiz.length-correct,pct=Math.round(correct/quiz.length*100);
  document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");
  document.getElementById("score").textContent=`${correct} / ${quiz.length}`;
  document.getElementById("correctCount").textContent=correct;document.getElementById("wrongCount").textContent=wrong;document.getElementById("percent").textContent=pct+"%";
  document.getElementById("scoreMessage").textContent=pct>=80?"表现很好，可以继续挑战完整题库。":pct>=60?"基础不错，建议针对错题再复习。":"建议重新练习并重点复习错题。";
}
function showReview(){
  const box=document.getElementById("review");box.classList.remove("hidden");
  const wrong=quiz.map((q,i)=>({q:q,i:i})).filter(x=>answers[x.i]!==x.q.displayAnswer);
  if(!wrong.length){box.innerHTML="<h3>没有错题</h3><p>本次全部答对。</p>";return}
  box.innerHTML="<h3>错题复习</h3>"+wrong.map(x=>{
    const q=x.q,i=x.i,chosen=answers[i];
    return `<div class="review-item"><strong>原题 ${q.number}</strong><br>${esc(q.question)}<br>
    <span class="small">你的答案：${["A","B","C","D"][chosen]}. ${esc(q.displayOptions[chosen])}</span><br>
    <span style="color:var(--good)"><strong>正确答案：${["A","B","C","D"][q.displayAnswer]}. ${esc(q.displayOptions[q.displayAnswer])}</strong></span></div>`;
  }).join("");
  box.scrollIntoView({behavior:"smooth"});
}
function restartSame(){startQuiz(lastMode.count,lastMode.randomize)}
function confirmExit(){if(confirm("确定退出本次练习吗？当前作答不会保存。")){document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("start").classList.remove("hidden")}}
</script>
